<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taski</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <aside>
      <div class="brand">
        <span class="brand-mark">Taski</span>
        <span class="brand-meta">MMXXVI</span>
      </div>
      <nav>
        <div class="tasks">
          <h2>Tasks</h2>
          <button class="is-active">All Tasks<span>12</span></button>
          <button>Today's Tasks<span>03</span></button>
          <button>Upcoming Tasks<span>09</span></button>
        </div>
        <div class="projects">
          <h2>Projects</h2>
          <div class="projects-list"></div>
          <button class="add-project">Add Project</button>
        </div>
      </nav>
    </aside>

    <dialog class="project-dialog">
      <form method="dialog" class="project-form">
        <h2>New Project</h2>

        <label for="project-name">Project Name</label>
        <input
          type="text"
          id="project-name"
          name="projectName"
          placeholder="Project name"
          required
        />

        <label for="project-description">Description</label>
        <textarea
          id="project-description"
          name="projectDescription"
          placeholder="Project description"
          rows="4"
        ></textarea>

        <div class="project-form-actions">
          <button type="button" class="cancel-project">Cancel</button>
          <button type="submit" class="create-project">Create Project</button>
        </div>
      </form>
    </dialog>

    <main>
      <header class="masthead">
        <h1>DASHBOARD</h1>
        <dl class="stats">
          <div class="projects-stat">
            <dt>Projects</dt>
            <dd>00</dd>
          </div>
          <div class="done-stat">
            <dt>Done</dt>
            <dd>03</dd>
          </div>
          <div class="date-stat">
            <dt>Today's Date</dt>
            <dd>08 / 30</dd>
          </div>
        </dl>
      </header>

      <form class="composer">
        <input type="text" placeholder="Add a task" aria-label="New task" />
        <button type="submit">Add</button>
      </form>

      <div class="tasks-list">
        <!-- Tasks will be rendered here -->
      </div>
    </main>
  </body>
</html>
